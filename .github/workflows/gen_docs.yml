name: Regenerate Docs
on: [workflow_dispatch]

jobs:
  RegenerateDocs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Clone Wiki
      uses: actions/checkout@v5
      with:
        repository: BelfrySCAD/BOSL2.wiki
        path: BOSL2.wiki

    - name: Apt Update
      run: sudo apt update

    - name: Install Required Libraries
      run: sudo apt-get install python3-pip python3-dev python3-setuptools python3-pil gifsicle libfuse2 xvfb

    - name: Install OpenSCAD-DocsGen package.
      run: sudo pip3 install openscad-docsgen imageio

    - name: Install OpenSCAD
      run: |
        cd $GITHUB_WORKSPACE
        wget https://github.com/openscad/openscad/releases/download/openscad-2021.01/OpenSCAD-2021.01-x86_64.AppImage
        sudo mv OpenSCAD-2021.01*-x86_64.AppImage /usr/local/bin/openscad
        sudo chmod +x /usr/local/bin/openscad

    # xvfb-run directly, rather than GabrielBB/xvfb-action, which declares
    # node12 and warns on every run. That action's whole body is
    # `xvfb-run --auto-servernum <options> <command>` and neither workflow
    # passed options, so this is the same command with nothing between it
    # and the runner.
    - name: Generate Docs
      env:
        OPENSCADPATH: ${{ github.workspace }}/..
      run: xvfb-run --auto-servernum openscad-docsgen -f

    - name: Upload Docs to Wiki
      uses: SwiftDocOrg/github-wiki-publish-action@v1
      with:
        path: "BOSL2.wiki"
      env:
        GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}

