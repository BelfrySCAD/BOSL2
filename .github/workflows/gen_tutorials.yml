# Renders the openscad code blocks in tutorials/*.md through BelfrySCAD's
# own evaluator rather than by launching the OpenSCAD binary once per
# image. The counterpart to the Checks workflow's CheckTutorials job,
# which runs the same tool with -T (execute every block, generate no
# images).
name: Regenerate Tutorials

on:
  workflow_dispatch:
    inputs:
      publish_to_wiki:
        description: "Push the generated tutorials to the live wiki (overwrites it)"
        type: boolean
        default: true

jobs:
  RegenerateTutorials:
    # macOS for a real GL implementation -- see the note in gen_docs.yml.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Clone Wiki
      uses: actions/checkout@v5
      with:
        repository: BelfrySCAD/BOSL2.wiki
        path: BOSL2.wiki

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # BelfrySCAD replaces openscad-mdimggen AND the OpenSCAD binary -- see
    # the note in gen_docs.yml for what goes away with them.
    - name: Install BelfrySCAD
      run: pip install belfryscad

    - name: Tabs Check
      run: |
        cd $GITHUB_WORKSPACE
        ./scripts/check_for_tabs.sh

    - name: Generate Tutorials
      env:
        OPENSCADPATH: ${{ github.workspace }}/..
      run: belfryscad --mdimggen -f

    # Uploaded whether or not the wiki gets published, and on failure too,
    # so a partial or unpublished run can still be inspected.
    - name: Upload generated tutorials
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: bosl2-wiki-tutorials
        path: BOSL2.wiki

    - name: Upload Tutorials to Wiki
      if: ${{ inputs.publish_to_wiki }}
      uses: SwiftDocOrg/github-wiki-publish-action@v1
      with:
        path: "BOSL2.wiki"
      env:
        GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
